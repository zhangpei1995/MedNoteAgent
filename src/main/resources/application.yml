server:
  port: 8080

spring:
  application:
    name: med-note-agent
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/mednote-agent.sqlite
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-sqlite.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    filter: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-dynamic-parameter: true
    enable-footer: false

mednote:
  agent:
    keyword:
      max-keywords: 12
      small-model:
        provider: dashscope
        model: qwen-turbo
        temperature: 0.1
        response-format: json_object

    intent:
      small-model:
        provider: dashscope
        model: qwen-turbo
        temperature: 0.1
        response-format: json_object
        timeout-ms: 800

    session:
      max-records: 100

  llm:
    agentscope:
      enabled: true
      provider: dashscope
      model: qwen-plus
      workspace: .agentscope/workspace
      timeout-ms: 10000
