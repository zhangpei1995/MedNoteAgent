server:
  port: 8080

spring:
  application:
    name: med-note-agent
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: jdbc:sqlite:${mednote.agent.store.sqlite.path:data/mednote-agent.db}
    driver-class-name: org.sqlite.JDBC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    filter: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-dynamic-parameter: true
    enable-footer: false

mednote:
  agent:
    keyword:
      max-keywords: 12
      small-model:
        provider: dashscope
        model: qwen-turbo
        temperature: 0.1
        response-format: json_object

    intent:
      small-model:
        provider: dashscope
        model: qwen-turbo
        temperature: 0.1
        response-format: json_object
        timeout-ms: 800

    session:
      max-records: 100
    executor:
      parallelism: 4
    store:
      sqlite:
        path: data/mednote-agent.db
